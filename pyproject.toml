[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "human30"
version = "2.0.0"
description = "Empirical 4-Layer Human Cohort Generator & Dual-Surface Multi-Agent Behavioral Simulator (Zero Dependencies)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["multi-agent", "simulation", "persona", "psychology", "llm", "counterfactual", "korean"]

[project.scripts]
human30 = "human30.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["human30*"]

[tool.setuptools.package-data]
human30 = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
