<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#007aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="심리측정">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.svg">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>AI 개인화 심리측정 테스트</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.6;-webkit-tap-highlight-color:transparent}
.header{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #e0e0e0;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top));z-index:100}
.header h1{font-size:18px;font-weight:600}
.progress-bar{height:4px;background:#e0e0e0;border-radius:2px;margin-top:8px}
.progress-fill{height:100%;background:#007aff;border-radius:2px;transition:width .3s}
.progress-text{font-size:12px;color:#86868b;margin-top:4px}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:6px 14px;border-radius:16px;font-size:13px;cursor:pointer;border:1px solid #d1d1d6;background:#fff;transition:all .2s;white-space:nowrap;flex-shrink:0}
.tab.active{background:#007aff;color:#fff;border-color:#007aff}
.tab.done{background:#34c759;color:#fff;border-color:#34c759}
.tab:hover{opacity:.8}
.container{max-width:720px;margin:0 auto;padding:20px;padding-bottom:80px}
.block{display:none}
.block.active{display:block}
.block-intro{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid #e0e0e0}
.block-intro h2{font-size:16px;margin-bottom:8px}
.block-intro p{font-size:14px;color:#86868b}
.scale-legend{display:flex;justify-content:space-between;font-size:11px;color:#86868b;padding:0 4px;margin-bottom:16px;flex-wrap:wrap;gap:2px}
.item{background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:12px;border:1px solid #e0e0e0;transition:border-color .2s,box-shadow .2s}
.item.answered{border-color:#34c759}
.item.focused{box-shadow:inset 4px 0 0 #007aff;background:#f0f7ff}
.item-num{font-size:12px;color:#86868b;margin-bottom:4px}
.item-text{font-size:15px;margin-bottom:12px}
.options{display:flex;gap:6px}
.opt{flex:1;text-align:center;padding:10px 4px;border-radius:8px;cursor:pointer;border:2px solid #e0e0e0;font-size:14px;font-weight:500;transition:all .15s;user-select:none;-webkit-user-select:none}
.opt:hover{border-color:#007aff;background:#f0f7ff}
.opt.selected{background:#007aff;color:#fff;border-color:#007aff}
.vignette{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #e0e0e0}
.vignette.answered{border-color:#34c759}
.v-title{font-size:13px;color:#007aff;font-weight:600;margin-bottom:6px}
.v-scenario{font-size:15px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
.v-sub{margin-bottom:14px;transition:box-shadow .2s}
.v-sub:last-child{margin-bottom:0}
.v-sub.focused{box-shadow:inset 4px 0 0 #007aff;background:#f0f7ff;border-radius:8px;padding:8px;margin-left:-8px}
.v-sub-text{font-size:14px;margin-bottom:8px;color:#333}
.nav-buttons{display:flex;justify-content:space-between;margin-top:24px;padding-bottom:40px}
.btn{padding:12px 28px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;border:none;transition:all .2s}
.btn-prev{background:#e0e0e0;color:#1d1d1f}
.btn-next{background:#007aff;color:#fff}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.result-box{background:#1d1d1f;color:#0f0;border-radius:12px;padding:20px;font-family:'SF Mono','Menlo',monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto;margin:16px 0;-webkit-overflow-scrolling:touch}
.copy-btn{background:#34c759;color:#fff;padding:14px 32px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;border:none;display:block;margin:0 auto;width:100%;max-width:320px}
.copy-btn:hover{opacity:.85}
.copy-btn:active{transform:scale(.97)}
.unanswered-warning{background:#ff3b30;color:#fff;padding:10px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;display:none}
.shortcut-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(29,29,31,.92);color:rgba(255,255,255,.85);padding:6px 20px;padding-bottom:max(6px,env(safe-area-inset-bottom));font-size:11px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;z-index:100;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.shortcut-bar span{white-space:nowrap}
kbd{background:rgba(255,255,255,.15);padding:1px 5px;border-radius:3px;font-family:inherit;font-size:11px;margin:0 1px}
.reset-row{display:flex;gap:8px;margin-top:16px;justify-content:center}
.btn-reset{background:#ff3b30;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;cursor:pointer;border:none}
@media(max-width:480px){
  .shortcut-bar{display:none}
  .scale-legend{font-size:9px}
  .opt{padding:8px 2px;font-size:13px}
  .item{padding:12px 14px}
}
</style>
</head>
<body>
<div class="header">
<h1>AI 개인화 심리측정 테스트</h1>

// ─── STATE ───
const STORAGE_KEY = 'psych_test_answers';
let currentBlock = 0;
let focusIdx = 0;
const answers = loadAnswers() || {
  pvqrr: new Array(57).fill(null),
  gcos: Array.from({length:17}, ()=>[null,null,null]),
  ecrr: new Array(36).fill(null),
  rei: new Array(40).fill(null)
};

function loadAnswers(){
  try { const d = localStorage.getItem(STORAGE_KEY); return d ? JSON.parse(d) : null; }
  catch(e){ return null; }
}
function saveAnswers(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(answers)); } catch(e){}
}
function resetAnswers(){
  if(!confirm('모든 응답을 초기화하시겠습니까?')) return;
  answers.pvqrr.fill(null);
  answers.gcos = Array.from({length:17}, ()=>[null,null,null]);
  answers.ecrr.fill(null);
  answers.rei.fill(null);
  saveAnswers();
  renderBlock(0);
}

// ─── RENDER ───
function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = BLOCKS.map((b,i)=>{
    const done = isBlockDone(i);
    const cls = i===currentBlock?'tab active': done?'tab done':'tab';
    return `<div class="${cls}" onclick="goBlock(${i})">${b.short}</div>`;
  }).join('') + `<div class="tab" onclick="goBlock(4)" style="margin-left:auto;background:#ff9500;color:#fff;border-color:#ff9500">결과</div>`;
}

function isBlockDone(bi){
  const b = BLOCKS[bi];
  const a = answers[b.id];
  if(b.type==='vignette') return a.every(v=>v.every(x=>x!==null));
  return a.every(x=>x!==null);
}

function countAnswered(){
  let done=0, total=184;
  done += answers.pvqrr.filter(x=>x!==null).length;
  answers.gcos.forEach(v=>v.forEach(x=>{if(x!==null)done++}));
  done += answers.ecrr.filter(x=>x!==null).length;
  done += answers.rei.filter(x=>x!==null).length;
  return {done,total};
}

function updateProgress(){
  const {done,total} = countAnswered();
  document.getElementById('progressFill').style.width = (done/total*100)+'%';
  document.getElementById('progressText').textContent = `${done} / ${total} 완료 (${Math.round(done/total*100)}%)`;
}

function renderBlock(bi){
  currentBlock = bi;
  focusIdx = 0;
  const c = document.getElementById('container');
  if(bi===4){ renderResult(); renderTabs(); updateProgress(); return; }
  const b = BLOCKS[bi];
  const a = answers[b.id];
  let html = `<div class="block active">`;
  html += `<div class="block-intro"><h2>${b.name}</h2><p>${b.intro}</p></div>`;
  html += `<div class="scale-legend">`;
  for(let i=0;i<b.scale;i++) html += `<span>${i+1}=${b.scaleLabels[i]}</span>`;
  html += `</div>`;

  if(b.type==='simple'){
    b.items.forEach((item,idx)=>{
      const ans = a[idx];
      html += `<div class="item ${ans!==null?'answered':''}" id="item-${idx}">`;
      html += `<div class="item-num">${idx+1} / ${b.items.length}</div>`;
      html += `<div class="item-text">${item}</div>`;
      html += `<div class="options">`;
      for(let v=1;v<=b.scale;v++){
        html += `<div class="opt ${ans===v?'selected':''}" onclick="answer('${b.id}',${idx},${v})">${v}</div>`;
      }
      html += `</div></div>`;
    });
  } else {
    b.items.forEach((vig,vi)=>{
      const va = a[vi];
      const allDone = va.every(x=>x!==null);
      html += `<div class="vignette ${allDone?'answered':''}" id="vig-${vi}">`;
      html += `<div class="v-title">상황 ${vi+1} / ${b.items.length}</div>`;
      html += `<div class="v-scenario">${vig.scenario}</div>`;
      vig.subs.forEach((sub,si)=>{
        html += `<div class="v-sub">`;
        html += `<div class="v-sub-text">${String.fromCharCode(97+si)}) ${sub}</div>`;
        html += `<div class="options">`;
        for(let v=1;v<=b.scale;v++){
          html += `<div class="opt ${va[si]===v?'selected':''}" onclick="answerVig(${vi},${si},${v})">${v}</div>`;
        }
        html += `</div></div>`;
      });
      html += `</div>`;
    });
  }

  html += `<div class="nav-buttons">`;
  html += bi>0?`<button class="btn btn-prev" onclick="goBlock(${bi-1})">이전 블록</button>`:`<div></div>`;
  html += bi<3?`<button class="btn btn-next" onclick="goBlock(${bi+1})">다음 블록</button>`:
    `<button class="btn btn-next" style="background:#ff9500" onclick="goBlock(4)">결과 보기</button>`;
  html += `</div></div>`;
  c.innerHTML = html;
  renderTabs();
  updateProgress();
  window.scrollTo(0,0);
  setTimeout(updateFocus, 50);
}

function answer(blockId, idx, val){
  answers[blockId][idx] = val;
  saveAnswers();
  const item = document.getElementById('item-'+idx);
  item.classList.add('answered');
  item.querySelectorAll('.opt').forEach(o=>{
    o.classList.toggle('selected', parseInt(o.textContent)===val);
  });
  updateProgress();
  renderTabs();
  const next = document.getElementById('item-'+(idx+1));
  if(next && answers[blockId][idx+1]===null){
    setTimeout(()=>next.scrollIntoView({behavior:'smooth',block:'center'}),150);
  }
}

function answerVig(vi, si, val){
  answers.gcos[vi][si] = val;
  saveAnswers();
  const vig = document.getElementById('vig-'+vi);
  const allDone = answers.gcos[vi].every(x=>x!==null);
  if(allDone) vig.classList.add('answered');
  vig.querySelectorAll('.v-sub')[si].querySelectorAll('.opt').forEach(o=>{
    o.classList.toggle('selected', parseInt(o.textContent)===val);
  });
  updateProgress();
  renderTabs();
}

function goBlock(bi){ renderBlock(bi); }

function renderResult(){
  const c = document.getElementById('container');
  const {done,total} = countAnswered();
  const allDone = done===total;
  const result = {
    pvqrr: answers.pvqrr,
    gcos: answers.gcos,
    ecrr: answers.ecrr,
    rei: answers.rei,
    timestamp: new Date().toISOString(),
    complete: allDone
  };
  const json = JSON.stringify(result, null, 2);

  let missing = '';
  if(!allDone){
    missing = '<div class="unanswered-warning" style="display:block">미응답 문항이 있습니다: ';
    const parts = [];
    const pMiss = answers.pvqrr.reduce((a,v,i)=>v===null?[...a,i+1]:a,[]);
    if(pMiss.length) parts.push(`가치관 ${pMiss.join(',')}`);
    const gMiss = [];
    answers.gcos.forEach((v,i)=>v.forEach((x,j)=>{if(x===null)gMiss.push(`${i+1}${String.fromCharCode(97+j)}`)}));
    if(gMiss.length) parts.push(`동기 ${gMiss.join(',')}`);
    const eMiss = answers.ecrr.reduce((a,v,i)=>v===null?[...a,i+1]:a,[]);
    if(eMiss.length) parts.push(`애착 ${eMiss.join(',')}`);
    const rMiss = answers.rei.reduce((a,v,i)=>v===null?[...a,i+1]:a,[]);
    if(rMiss.length) parts.push(`인지 ${rMiss.join(',')}`);
    missing += parts.join(' | ') + '</div>';
  }

  c.innerHTML = `
    <div class="block active">
      <div class="block-intro">
        <h2>결과 (${done}/${total})</h2>
        <p>${allDone?'모든 문항 응답 완료. 아래 JSON을 복사해서 Claude에 붙여넣으세요.':'미완료 문항이 있습니다. 돌아가서 완료하거나, 현재 상태로 결과를 복사할 수 있습니다.'}</p>
      </div>
      ${missing}
      <div class="result-box" id="resultJson">${json}</div>
      <button class="copy-btn" onclick="copyResult()">클립보드에 복사</button>
      <p style="text-align:center;margin-top:12px;color:#86868b;font-size:13px" id="copyMsg"></p>
      <div class="reset-row">
        <button class="btn-reset" onclick="resetAnswers()">전체 초기화</button>
      </div>
      <div class="nav-buttons"><button class="btn btn-prev" onclick="goBlock(3)">이전 블록</button><div></div></div>
    </div>`;
  renderTabs();
  updateProgress();
  window.scrollTo(0,0);
}

function copyResult(){
  const text = document.getElementById('resultJson').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    document.getElementById('copyMsg').textContent = '복사됨! Claude에 붙여넣으세요.';
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    document.getElementById('copyMsg').textContent = '복사됨!';
  });
}

// ─── FOCUS & KEYBOARD ───
function getMaxIdx(){
  const b = BLOCKS[currentBlock];
  if(!b) return 0;
  return b.type==='simple' ? b.items.length-1 : b.items.length*3-1;
}

function updateFocus(){
  document.querySelectorAll('.focused').forEach(el=>el.classList.remove('focused'));
  if(currentBlock===4) return;
  const b = BLOCKS[currentBlock];
  if(b.type==='simple'){
    const el = document.getElementById('item-'+focusIdx);
    if(el){ el.classList.add('focused'); el.scrollIntoView({behavior:'smooth',block:'center'}); }
  } else {
    const vi = Math.floor(focusIdx/3), si = focusIdx%3;
    const vig = document.getElementById('vig-'+vi);
    if(vig){
      const sub = vig.querySelectorAll('.v-sub')[si];
      if(sub){ sub.classList.add('focused'); sub.scrollIntoView({behavior:'smooth',block:'center'}); }
    }
  }
}

function adjustAnswer(delta){
  const b = BLOCKS[currentBlock];
  let cur;
  if(b.type==='simple'){
    cur = answers[b.id][focusIdx];
  } else {
    cur = answers.gcos[Math.floor(focusIdx/3)][focusIdx%3];
  }
  let nv = (cur||0)+delta;
  if(nv<1) nv=1; if(nv>b.scale) nv=b.scale;
  if(b.type==='simple') answer(b.id, focusIdx, nv);
  else answerVig(Math.floor(focusIdx/3), focusIdx%3, nv);
}

function findNextUnanswered(){
  const b = BLOCKS[currentBlock];
  const max = getMaxIdx();
  for(let i=focusIdx+1;i<=max;i++){
    if(b.type==='simple'){
      if(answers[b.id][i]===null) return i;
    } else {
      if(answers.gcos[Math.floor(i/3)][i%3]===null) return i;
    }
  }
  for(let i=0;i<=focusIdx;i++){
    if(b.type==='simple'){
      if(answers[b.id][i]===null) return i;
    } else {
      if(answers.gcos[Math.floor(i/3)][i%3]===null) return i;
    }
  }
  return focusIdx;
}

document.addEventListener('keydown', e=>{
  if(currentBlock===4) return;
  const b = BLOCKS[currentBlock];
  const max = getMaxIdx();

  if(e.key>='1' && e.key<='9'){
    const val = parseInt(e.key);
    if(val>b.scale) return;
    e.preventDefault();
    if(b.type==='simple') answer(b.id, focusIdx, val);
    else answerVig(Math.floor(focusIdx/3), focusIdx%3, val);
    if(focusIdx<max){ focusIdx++; updateFocus(); }
    return;
  }

  switch(e.key){
    case 'ArrowDown':
    case ' ':
      e.preventDefault();
      if(focusIdx<max){ focusIdx++; updateFocus(); }
      break;
    case 'ArrowUp':
      e.preventDefault();
      if(focusIdx>0){ focusIdx--; updateFocus(); }
      break;
    case 'ArrowRight':
      e.preventDefault();
      adjustAnswer(1);
      break;
    case 'ArrowLeft':
      e.preventDefault();
      adjustAnswer(-1);
      break;
    case 'Enter':
      e.preventDefault();
      if(currentBlock<3) goBlock(currentBlock+1);
      else goBlock(4);
      break;
    case 'Backspace':
    case 'Delete':
      e.preventDefault();
      if(currentBlock>0) goBlock(currentBlock-1);
      break;
    case 'Tab':
      e.preventDefault();
      focusIdx = findNextUnanswered();
      updateFocus();
      break;
  }
});

// ─── SERVICE WORKER ───
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ─── INIT ───
renderBlock(0);
</script>
</body>
</html>
